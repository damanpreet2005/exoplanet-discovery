services:
  ml-service:
    restart: unless-stopped
    build: ./ml_service
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      # Single authoritative location for the model artifact -- mounted
      # read-only, never copied or duplicated into the image.
      - ./model:/model:ro
    environment:
      - MODEL_PATH=/model/hybrid_ensemble_model.pkl
      - RF_WEIGHT=${RF_WEIGHT:-0.5}
      - CNN_WEIGHT=${CNN_WEIGHT:-0.5}
      - MODEL_VERSION=${MODEL_VERSION:-1.0}
      - CACHE_TTL=${CACHE_TTL:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./Backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ML_SERVICE_URL=http://ml-service:8001
      - ML_SERVICE_TIMEOUT=${ML_SERVICE_TIMEOUT:-10}
      - ML_SERVICE_ANALYSIS_TIMEOUT=${ML_SERVICE_ANALYSIS_TIMEOUT:-60}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:5500}
      # ---- User accounts ----
      - APP_ENV=${APP_ENV:-production}
      # Secure cookies by default. Chrome/Firefox accept them on
      # http://localhost; set COOKIE_SECURE=false in .env only for local
      # testing in browsers that don't (e.g. Safari).
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB_NAME=${MONGO_APP_DB:-exodiscovery}
      - MONGODB_AUTH_SOURCE=${MONGO_APP_DB:-exodiscovery}
      - MONGODB_USERNAME=${MONGO_APP_USERNAME:-exodiscovery_app}
      - MONGODB_PASSWORD=${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env (see .env.example)}
      # Ed25519 signing key (generate with `npm run generate:jwt-key` in
      # Backend/). Unset = account features answer 503; the rest of the app
      # is unaffected.
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-}
      - JWT_ISSUER=${JWT_ISSUER:-https://exodiscovery.online}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-exodiscovery-web}
      - ACCESS_TOKEN_TTL_SECONDS=${ACCESS_TOKEN_TTL_SECONDS:-600}
    networks:
      - default
      - db
    depends_on:
      - ml-service
      - mongo

  # User-account database. Deliberately has NO `ports:` -- it is reachable
  # only by the backend over the internal `db` network, never from the host
  # or the internet. Data lives in the named volume, so it survives container
  # restarts/rebuilds.
  mongo:
    image: mongo:8.0.15
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env (see .env.example)}
      # Read by deploy/mongo-init/01-create-app-user.js on first start only.
      - MONGO_APP_DB=${MONGO_APP_DB:-exodiscovery}
      - MONGO_APP_USERNAME=${MONGO_APP_USERNAME:-exodiscovery_app}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env (see .env.example)}
    volumes:
      - mongo-data:/data/db
      - ./deploy/mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  frontend:
    restart: unless-stopped
    build:
      context: ./Frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    # Loopback only: public traffic arrives through the Cloudflare tunnel below.
    ports:
      - "127.0.0.1:5500:5500"
    depends_on:
      - backend

  # Cloudflare named tunnel: outbound-only connection; routes exodiscovery.online
  # and www to http://frontend:5500. Hostnames are managed in the Cloudflare
  # dashboard. The token lives only in ./.env on the server (never committed):
  #   EXO_TUNNEL_TOKEN=eyJ...
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate --edge-ip-version 4 run
    environment:
      - TUNNEL_TOKEN=${EXO_TUNNEL_TOKEN:-}
    depends_on:
      - frontend
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

networks:
  default: {}
  # Internal-only: no route to the outside world and nothing published on
  # the host. Only the backend and mongo are attached.
  db:
    internal: true

volumes:
  mongo-data: {}
